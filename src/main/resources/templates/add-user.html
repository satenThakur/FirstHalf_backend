<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Tutor</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">

</head>

<body>
<div th:insert="fragments/header :: header"></div>
<div class="container my-2">
    <div class="card">
        <div class="card-body">
            <form action="#" th:action="@{/save-user}" th:object="${user}" method="post">
                <div class="row">
                    <div class="form-group col-md-8">
                        <label for="name" class="col-form-label">User Name</label>
                        <input type="text" th:field="*{name}" class="form-control" id="name"
                               placeholder="User Name"/>
                    </div>

                    <div class="form-group col-md-8">
                        <label for="phone" class="col-form-label">Phone</label>
                        <input type="text" th:field="*{phone}" class="form-control" id="phone"
                               placeholder="Phone"/>
                    </div>

                    <div class="form-group col-md-8">
                        <label for="email" class="col-form-label">Email</label>
                        <input type="text" th:field="*{email}" class="form-control" id="email"
                               placeholder="Email"/>
                    </div>

                    <div class="form-group col-md-8">
                        <label for="weight" class="col-form-label">Weight</label>
                        <input type="text" th:field="*{weight}" class="form-control" id="weight"
                               placeholder="Weight"/>
                    </div>

                    <div class="form-group col-md-8">
                        <label for="height" class="col-form-label">Height</label>
                        <input type="text" th:field="*{height}" class="form-control" id="height"
                               placeholder="Height"/>
                    </div>

                    <div class="col-md-6">
                        <input type="submit" class="btn btn-primary" value=" Submit ">
                    </div>

                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
